# -*- conf -*-

# For documentation on these options, see `man fnott.ini`

# Global values
output=DP-1
# min-width=0
# max-width=0
# max-height=0
stacking-order=top-down
anchor=top-right
# edge-margin-vertical=10
# edge-margin-horizontal=10
# notification-margin=10
# icon-theme=hicolor
# max-icon-size=32
# selection-helper=dmenu
# selection-helper-uses-null-separator=no
# play-sound=aplay ${filename}
scaling-filter=lanczos3

# Default values, may be overridden in 'urgency' specific sections
layer=top
background=282a36c0

border-color=bd93f9ff
border-radius=12
border-size=2

padding-vertical=8
padding-horizontal=12

dpi-aware=no

title-font=Readex Pro:weight=Bold:size=12
title-color=bd93f9ff
title-format=%a %A

summary-font=Rubik:weight=Light:size=10
summary-color=f8f8f2ff
summary-format=<i>%s</i>\n

body-font=Rubik:weight=Light:size=10
body-color=f8f8f2ff
body-format=%b

progress-bar-height=20
progress-color=bd93f9ff
progress-style=bar

# sound-file=
# icon=

# Timeout values are in seconds. 0 to disable
# max-timeout=0
# default-timeout=0
# idle-timeout=0

# [low]
# background=2b2b2bff
# title-color=888888ff
# summary-color=888888ff
# body-color=888888ff

# [normal]

# [critical]
# background=6c3333ff
