#--------#
# Colors #
#--------#
# Background
background #282a36
background_opacity 1.0
background_blur 16
transparent_background_colors #21222c@0.75 #16171d@0.75 #1d1e27@0.75 #645484@0.75 #353747@0.75
selection_background #645484

background_image ~/.config/kitty/wallpapers/natanelove.jpg
background_image_layout cscaled
background_image_linear no
background_tint 0.75
background_tint_gaps 2.0

dim_opacity 0.3

# Foreground
foreground #f8f8f2
selection_foreground #f8f8f2
inactive_text_alpha 0.8

# Border
active_border_color #bd93f9
inactive_border_color #666666

# Terminal GUI Colors
color0 #21222c
color1 #ff5555
color2 #50fa7b
color3 #f1fa8c
color4 #bd93f9
color5 #ff79c6
color6 #8be9fd
color7 #f8f8f2
color8 #6272a4
color9 #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff
color15 #ffffff

#--------#
# Cursor #
#--------#
cursor #bd93f9
cursor_shape block
cursor_shape_unfocused hollow
#cursor_beam_thickness 1
cursor_blink_interval -1
cursor_trail 2
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_trail_color #bd93f9
